name: iOS CI

on:
  push:
    branches: [ "main", "cursor/**", "widget/**", "feature/**" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 30

    env:
      XCODE_PROJECT: ios/StrideCheck.xcodeproj
      SCHEME: StrideCheck
      # `xcodebuild test` requires a concrete device; `build` can use generic.
      BUILD_DESTINATION: "generic/platform=iOS Simulator"
      # Overwritten by "Resolve test simulator destination" when destinations are available.
      TEST_DESTINATION: "platform=iOS Simulator,name=iPhone 16,OS=latest"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer

      - name: Show build tools
        run: |
          xcodebuild -version
          swift --version

      - name: Install SwiftLint and xcpretty
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install swiftlint xcpretty
          cd ios && swiftlint lint --strict

      - name: Resolve test simulator destination
        shell: bash
        run: |
          set -euo pipefail
          python3 << 'PY'
          import os
          import re
          import subprocess
          import sys

          proj = os.environ["XCODE_PROJECT"]
          scheme = os.environ["SCHEME"]
          result = subprocess.run(
              ["xcodebuild", "-project", proj, "-scheme", scheme, "-showdestinations"],
              check=True,
              capture_output=True,
              text=True,
          )
          out = (result.stdout or "") + (result.stderr or "")
          lines = [
              l.strip()
              for l in out.splitlines()
              if "platform:iOS Simulator" in l and "placeholder" not in l
          ]

          def parse(line: str):
              m_name = re.search(r"name:([^,}]+)", line)
              if not m_name:
                  return None
              name = m_name.group(1).strip()
              m_os = re.search(r"OS:([^,}]+)", line)
              os_ver = m_os.group(1).strip() if m_os else "latest"
              return name, os_ver

          candidates = []
          for line in lines:
              p = parse(line)
              if p and p[0].startswith("iPhone"):
                  candidates.append(p)
          if not candidates:
              print("No iPhone simulator destinations found in xcodebuild -showdestinations", file=sys.stderr)
              sys.exit(1)
          chosen = next((c for c in candidates if c[0] == "iPhone 16"), candidates[0])
          name, os_ver = chosen
          dest = f"platform=iOS Simulator,name={name},OS={os_ver}"
          print(f"Resolved TEST_DESTINATION={dest}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"TEST_DESTINATION={dest}\n")
          PY

      - name: List simulator destinations (diagnostic)
        continue-on-error: true
        run: xcodebuild -project "$XCODE_PROJECT" -scheme "$SCHEME" -showdestinations

      # Restore Derived Data cache to speed up subsequent builds.
      - name: Cache derived data
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: derived-${{ runner.os }}-${{ hashFiles('ios/StrideCheck.xcodeproj/project.pbxproj') }}
          restore-keys: derived-${{ runner.os }}-

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -resolvePackageDependencies \
            -clonedSourcePackagesDirPath .spm-cache

      # Build the main app target for the simulator. We use CODE_SIGN_IDENTITY=""
      # and PROVISIONING_PROFILE="" to skip signing on CI.
      - name: Build (simulator)
        shell: bash
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$SCHEME" \
            -destination "$BUILD_DESTINATION" \
            -derivedDataPath ~/Library/Developer/Xcode/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color

      # Run unit tests (StrideCheckTests target).
      # The target must be added to the Xcode project — see ios/StrideCheckTests/README.md.
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$XCODE_PROJECT" \
            -scheme "$SCHEME" \
            -destination "$TEST_DESTINATION" \
            -derivedDataPath ~/Library/Developer/Xcode/DerivedData \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: TestResults.xcresult
          retention-days: 14
          if-no-files-found: warn
