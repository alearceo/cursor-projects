name: iOS CI

on:
  push:
    branches: [ "main", "cursor/**", "widget/**", "feature/**" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 30

    env:
      XCODE_PROJECT: ios/StrideCheck.xcodeproj
      SCHEME: StrideCheck
      DESTINATION: "platform=iOS Simulator,name=iPhone 16,OS=latest"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer

      - name: Show build tools
        run: |
          xcodebuild -version
          swift --version

      # Restore Derived Data cache to speed up subsequent builds.
      - name: Cache derived data
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: derived-${{ runner.os }}-${{ hashFiles('ios/StrideCheck.xcodeproj/project.pbxproj') }}
          restore-keys: derived-${{ runner.os }}-

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -resolvePackageDependencies \
            -clonedSourcePackagesDirPath .spm-cache

      # Build the main app target for the simulator. We use CODE_SIGN_IDENTITY=""
      # and PROVISIONING_PROFILE="" to skip signing on CI.
      - name: Build (simulator)
        run: |
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath ~/Library/Developer/Xcode/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color || true

      # Run unit tests (StrideCheckTests target).
      # The target must be added to the Xcode project — see ios/StrideCheckTests/README.md.
      - name: Test
        run: |
          xcodebuild test \
            -project "$XCODE_PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath ~/Library/Developer/Xcode/DerivedData \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: TestResults.xcresult
          retention-days: 14
